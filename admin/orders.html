<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý đơn hàng – Admin Handmade Corner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">
        <span>🧶</span><h2>Handmade Corner</h2>
        <span class="admin-sidebar__badge">Admin</span>
      </div>
      <nav class="admin-sidebar__nav">
        <div class="admin-nav__section">
          <div class="admin-nav__section-title">Tổng quan</div>
          <a href="index.html" class="admin-nav__item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
          <a href="../index.html" class="admin-nav__item" target="_blank"><i class="fas fa-external-link-alt"></i> Xem website</a>
        </div>
        <div class="admin-nav__section">
          <div class="admin-nav__section-title">Quản lý</div>
          <a href="products.html" class="admin-nav__item"><i class="fas fa-box-open"></i> Sản phẩm</a>
          <a href="orders.html" class="admin-nav__item active"><i class="fas fa-shopping-cart"></i> Đơn hàng</a>
          <a href="reviews.html" class="admin-nav__item"><i class="fas fa-star"></i> Đánh giá</a>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar__title">Quản lý đơn hàng (SQLite DB)</div>
        <div class="admin-topbar__actions">
          <div class="admin-topbar__user"><div class="admin-topbar__avatar">A</div> <span id="admin-name">Admin</span></div>
          <button class="btn btn-ghost btn-sm" onclick="handleAdminLogout()" title="Đăng xuất Admin">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
          </button>
        </div>
      </div>

      <div class="admin-content">
        <div class="admin-page-header">
          <div>
            <h2>Đơn hàng</h2>
            <p id="order-count">Đang tải...</p>
          </div>
        </div>

        <!-- STATS ROW -->
        <div class="stats-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:28px;" id="order-stats">
          <!-- Rendered by JS -->
        </div>

        <!-- FILTERS -->
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;" id="status-tabs">
          <button class="category-chip active" onclick="filterStatus('all')">Tất cả</button>
          <button class="category-chip" onclick="filterStatus('pending')">⏳ Chờ xác nhận</button>
          <button class="category-chip" onclick="filterStatus('confirmed')">✅ Đã xác nhận</button>
          <button class="category-chip" onclick="filterStatus('preparing')">📦 Đang chuẩn bị</button>
          <button class="category-chip" onclick="filterStatus('shipping')">🚚 Đang giao</button>
          <button class="category-chip" onclick="filterStatus('completed')">🎉 Hoàn thành</button>
          <button class="category-chip" onclick="filterStatus('cancelled')">❌ Đã hủy</button>
        </div>

        <!-- TABLE CONTROLS -->
        <div class="table-controls">
          <div class="table-search">
            <input type="text" id="search-input" placeholder="Tìm theo mã đơn, tên KH..." oninput="applyFilters()" />
            <button><i class="fas fa-search"></i></button>
          </div>
          <div style="font-size:.85rem;color:var(--text-light);" id="result-count">0 đơn hàng</div>
        </div>

        <!-- TABLE -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Mã đơn</th>
                <th>Khách hàng</th>
                <th>Sản phẩm</th>
                <th>Tổng tiền</th>
                <th>Thanh toán</th>
                <th>Trạng thái</th>
                <th>Thời gian</th>
                <th style="width:180px;">Thao tác</th>
              </tr>
            </thead>
            <tbody id="order-table-body">
              <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-light);">Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ORDER DETAIL MODAL -->
  <div id="order-detail-modal" class="modal-overlay" style="display:none;">
    <div class="modal" style="max-width:640px;">
      <div class="modal__header">
        <h3 id="detail-modal-title">Chi tiết đơn hàng</h3>
        <button class="modal__close" onclick="closeDetailModal()">×</button>
      </div>
      <div class="modal__body" id="detail-modal-body">
        <!-- Rendered by JS -->
      </div>
      <div class="modal__footer">
        <button class="btn btn-ghost" onclick="closeDetailModal()">Đóng</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../js/store.js"></script>
  <script>
    let currentStatus = 'all';

    function showToast(msg, type = 'success') {
      const tc = document.getElementById('toast-container');
      const t  = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'times-circle'}"></i> ${msg}`;
      tc.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    const STATUS_INFO  = Store.ORDER_STATUSES;
    const STATUS_FLOW  = ['pending','confirmed','preparing','shipping','completed'];

    async function renderOrderStats() {
      const orders = await Store.getOrders();
      const statuses = ['pending','confirmed','preparing','shipping','completed','cancelled'];
      const colors   = ['#F59E0B','#3B82F6','#8B5CF6','#EC4899','#10B981','#EF4444'];
      document.getElementById('order-stats').innerHTML = statuses.map((s, i) => {
        const count = orders.filter(o => o.status === s).length;
        const info  = STATUS_INFO[s.toUpperCase()] || {};
        return `
          <div class="stat-card" style="border-left-color:${colors[i]};cursor:pointer;" onclick="filterStatus('${s}')">
            <div class="stat-card__icon" style="background:${colors[i]}20;font-size:1.2rem;">${info.icon||'📦'}</div>
            <div>
              <div class="stat-card__value" style="color:${colors[i]};font-size:1.4rem;">${count}</div>
              <div class="stat-card__label">${info.label||s}</div>
            </div>
          </div>`;
      }).join('');
    }

    async function filterStatus(status) {
      currentStatus = status;
      document.querySelectorAll('#status-tabs .category-chip').forEach((btn, i) => {
        const vals = ['all','pending','confirmed','preparing','shipping','completed','cancelled'];
        btn.classList.toggle('active', vals[i] === status);
      });
      await applyFilters();
    }

    async function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const orders = await Store.getOrders({ status: currentStatus, q: search });
      renderTable(orders);
    }

    function getNextStatus(currentStatus) {
      const idx = STATUS_FLOW.indexOf(currentStatus);
      return idx >= 0 && idx < STATUS_FLOW.length - 1 ? STATUS_FLOW[idx+1] : null;
    }

    function renderTable(orders) {
      document.getElementById('result-count').textContent = `${orders.length} đơn hàng`;
      document.getElementById('order-count').textContent = `Hiển thị ${orders.length} đơn hàng`;

      if (orders.length === 0) {
        document.getElementById('order-table-body').innerHTML =
          '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-light);">Không có đơn hàng nào</td></tr>';
        return;
      }

      document.getElementById('order-table-body').innerHTML = orders.map(order => {
        const info     = STATUS_INFO[order.status.toUpperCase()] || { label: order.status, icon: '' };
        const nextSt   = getNextStatus(order.status);
        const nextInfo = nextSt ? STATUS_INFO[nextSt.toUpperCase()] : null;
        const canCancel = ['pending','confirmed'].includes(order.status);

        return `
          <tr>
            <td>
              <div style="font-weight:700;color:var(--accent);font-size:.85rem;">${order.id}</div>
              <div style="font-size:.72rem;color:var(--text-light);">${order.items.length} sản phẩm</div>
            </td>
            <td>
              <div style="font-weight:600;">${order.customer.name}</div>
              <div style="font-size:.78rem;color:var(--text-medium);">${order.customer.phone}</div>
              <div style="font-size:.75rem;color:var(--text-light);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${order.customer.city}</div>
            </td>
            <td>
              <div style="display:flex;gap:4px;">
                ${order.items.slice(0,3).map(i => `<img src="${i.productImage}" style="width:32px;height:32px;border-radius:4px;object-fit:cover;" title="${i.productName}" />`).join('')}
                ${order.items.length > 3 ? `<div style="width:32px;height:32px;border-radius:4px;background:var(--bg-section);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--text-light);">+${order.items.length-3}</div>` : ''}
              </div>
            </td>
            <td><strong style="color:var(--accent);">${Store.formatPrice(order.total)}</strong></td>
            <td style="font-size:.8rem;color:var(--text-light);">${order.paymentMethod.replace('Thanh toán khi nhận hàng','COD')}</td>
            <td><span class="badge badge-${order.status}">${info.icon} ${info.label}</span></td>
            <td style="font-size:.78rem;color:var(--text-light);">${Store.formatDate(order.createdAt)}</td>
            <td>
              <div style="display:flex;gap:4px;flex-wrap:wrap;">
                <button class="btn btn-ghost btn-sm" onclick="openDetailModal('${order.id}')" title="Xem chi tiết">
                  <i class="fas fa-eye"></i>
                </button>
                ${nextInfo ? `
                <button class="btn btn-success btn-sm" onclick="advanceOrder('${order.id}','${nextSt}')" title="Chuyển sang: ${nextInfo.label}">
                  ${nextInfo.icon} Tiếp
                </button>` : ''}
                ${canCancel ? `
                <button class="btn btn-danger btn-sm" onclick="cancelOrder('${order.id}')" title="Hủy đơn">
                  <i class="fas fa-times"></i>
                </button>` : ''}
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    async function advanceOrder(orderId, newStatus) {
      const info = STATUS_INFO[newStatus.toUpperCase()] || {};
      await Store.updateOrderStatus(orderId, newStatus, `Admin chuyển sang: ${info.label}`);
      showToast(`Đã chuyển đơn sang: ${info.label}`);
      await renderOrderStats();
      await applyFilters();
    }

    async function cancelOrder(orderId) {
      if (!confirm(`Hủy đơn hàng ${orderId}?`)) return;
      await Store.updateOrderStatus(orderId, 'cancelled', 'Admin hủy đơn');
      showToast('Đã hủy đơn hàng');
      await renderOrderStats();
      await applyFilters();
    }

    async function openDetailModal(orderId) {
      const order = await Store.getOrder(orderId);
      if (!order) return;
      const info = STATUS_INFO[order.status.toUpperCase()] || {};
      document.getElementById('detail-modal-title').textContent = `Chi tiết: ${order.id}`;
      document.getElementById('detail-modal-body').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;font-size:.88rem;">
          <div>
            <div style="color:var(--text-light);margin-bottom:2px;">Khách hàng</div>
            <div style="font-weight:600;">${order.customer.name}</div>
            <div>${order.customer.phone}</div>
            ${order.customer.email ? `<div>${order.customer.email}</div>` : ''}
          </div>
          <div>
            <div style="color:var(--text-light);margin-bottom:2px;">Địa chỉ</div>
            <div>${order.customer.address}</div>
            <div>${[order.customer.ward,order.customer.district,order.customer.city].filter(Boolean).join(', ')}</div>
          </div>
          <div>
            <div style="color:var(--text-light);margin-bottom:2px;">Thanh toán</div>
            <div>${order.paymentMethod}</div>
          </div>
          <div>
            <div style="color:var(--text-light);margin-bottom:2px;">Trạng thái</div>
            <span class="badge badge-${order.status}">${info.icon} ${info.label}</span>
          </div>
          ${order.customer.note ? `<div style="grid-column:1/-1;"><div style="color:var(--text-light);margin-bottom:2px;">Ghi chú</div><div style="background:var(--bg-section);padding:8px 12px;border-radius:var(--radius-sm);">${order.customer.note}</div></div>` : ''}
        </div>
        <div style="border-top:1px solid var(--border-light);padding-top:16px;margin-bottom:16px;">
          <div style="font-weight:600;margin-bottom:12px;">Sản phẩm đặt hàng:</div>
          ${order.items.map(item => `
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;">
              <img src="${item.productImage}" style="width:48px;height:48px;border-radius:var(--radius-sm);object-fit:cover;" />
              <div style="flex:1;">
                <div style="font-size:.88rem;font-weight:600;">${item.productName}</div>
                <div style="font-size:.78rem;color:var(--text-light);">x${item.quantity} · ${Store.formatPrice(item.price)}/cái</div>
              </div>
              <div style="font-weight:700;color:var(--accent);">${Store.formatPrice(item.price * item.quantity)}</div>
            </div>`).join('')}
          <div style="display:flex;justify-content:space-between;padding:12px 0 0;border-top:1px solid var(--border-light);font-size:1rem;font-weight:700;color:var(--accent);">
            <span>Tổng cộng</span>
            <span>${Store.formatPrice(order.total)}</span>
          </div>
        </div>
        <div style="border-top:1px solid var(--border-light);padding-top:16px;">
          <div style="font-weight:600;margin-bottom:10px;">Lịch sử trạng thái:</div>
          ${order.statusHistory.map(h => {
            const si = STATUS_INFO[(h.status||'').toUpperCase()] || {};
            return `<div style="display:flex;gap:10px;font-size:.82rem;margin-bottom:8px;">
              <span style="color:var(--text-light);white-space:nowrap;">${Store.formatDate(h.time)}</span>
              <span class="badge badge-${h.status}">${si.icon||''} ${si.label||h.status}</span>
              ${h.note ? `<span style="color:var(--text-light);">– ${h.note}</span>` : ''}
            </div>`;
          }).join('')}
        </div>`;
      document.getElementById('order-detail-modal').style.display = 'flex';
    }

    function closeDetailModal() {
      document.getElementById('order-detail-modal').style.display = 'none';
    }

    function handleAdminLogout() {
      Store.logoutAdmin();
      showToast('Đã đăng xuất khỏi tài khoản Admin');
      setTimeout(() => { window.location.href = 'login.html'; }, 500);
    }

    async function initPage() {
      if (!Store.requireAdmin()) return;
      const admin = Store.getCurrentAdmin();
      if (admin) document.getElementById('admin-name').textContent = admin.name || admin.username;

      await Store.init();
      await renderOrderStats();
      await applyFilters();
    }

    initPage();
  </script>
</body>
</html>
