<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – Handmade Corner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css?v=4" />
  <link rel="stylesheet" href="/css/components.css?v=4" />
  <link rel="stylesheet" href="/css/admin.css?v=4" />
</head>
<body>
  <div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">
        <span>🧶</span>
        <h2>Handmade Corner</h2>
        <span class="admin-sidebar__badge">Admin</span>
      </div>
      <nav class="admin-sidebar__nav">
        <div class="admin-nav__section">
          <div class="admin-nav__section-title">Tổng quan</div>
          <a href="/admin/index.html" class="admin-nav__item active">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
          <a href="/index.html" class="admin-nav__item" target="_blank">
            <i class="fas fa-external-link-alt"></i> Xem website
          </a>
        </div>
        <div class="admin-nav__section">
          <div class="admin-nav__section-title">Quản lý</div>
          <a href="/admin/products.html" class="admin-nav__item">
            <i class="fas fa-box-open"></i> Sản phẩm
          </a>
          <a href="/admin/orders.html" class="admin-nav__item">
            <i class="fas fa-shopping-cart"></i> Đơn hàng
            <span class="admin-nav__badge" id="pending-count">0</span>
          </a>
          <a href="/admin/reviews.html" class="admin-nav__item">
            <i class="fas fa-star"></i> Đánh giá
          </a>
        </div>
        <div class="admin-nav__section">
          <div class="admin-nav__section-title">Hệ thống</div>
          <a href="#" class="admin-nav__item" onclick="resetData()">
            <i class="fas fa-redo"></i> Reset dữ liệu
          </a>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar__title">
          <i class="fas fa-shield-alt" style="color:var(--admin-sidebar-active);"></i> Bảng điều khiển Quản trị (SQLite)
        </div>
        <div class="admin-topbar__actions">
          <span style="font-size:0.85rem;color:#7D6B5D;" id="current-time"></span>
          <div class="admin-topbar__user" id="admin-user-display">
            <div class="admin-topbar__avatar">A</div>
            <span id="admin-name">Admin</span>
          </div>
          <button class="btn btn-outline btn-sm" onclick="handleAdminLogout()" title="Đăng xuất Admin">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
          </button>
        </div>
      </div>

      <div class="admin-content">
        <!-- STATS GRID -->
        <div class="stats-grid" id="stats-grid">
          <!-- Rendered by JS -->
        </div>

        <!-- CHARTS / LISTS ROW -->
        <div class="admin-grid-2">
          <!-- Recent Orders -->
          <div class="chart-card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
              <h4>📦 Đơn hàng gần đây</h4>
              <a href="/admin/orders.html" class="btn btn-outline btn-sm">Xem tất cả</a>
            </div>
            <div class="recent-list" id="recent-orders">
              <!-- Rendered by JS -->
            </div>
          </div>

          <!-- Top Products -->
          <div class="chart-card">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
              <h4>🏆 Sản phẩm bán chạy</h4>
              <a href="/admin/products.html" class="btn btn-outline btn-sm">Quản lý</a>
            </div>
            <div id="top-products">
              <!-- Rendered by JS -->
            </div>
          </div>
        </div>

        <!-- CATEGORIES STATS -->
        <div class="chart-card">
          <h4 style="margin-bottom:18px;">📊 Thống kê tồn kho theo danh mục</h4>
          <div id="category-stats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="/js/store.js"></script>
  <script>
    function showToast(msg, type = 'success') {
      const tc = document.getElementById('toast-container');
      const t  = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'times-circle'}"></i> ${msg}`;
      tc.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    function formatImgUrl(img) {
      if (!img) return '/images/hero-main.png';
      if (img.startsWith('http')) return img;
      return '/' + img.replace(/^\.?\/?/, '');
    }

    function updateClock() {
      const el = document.getElementById('current-time');
      if (el) el.textContent = new Date().toLocaleString('vi-VN');
    }
    updateClock();
    setInterval(updateClock, 1000);

    async function renderStats() {
      const s = await Store.getStats();
      const pendingEl = document.getElementById('pending-count');
      if (pendingEl) pendingEl.textContent = s.pendingOrders;

      const statsData = [
        { icon: '💰', label: 'Doanh thu',     value: Store.formatPrice(s.totalRevenue), color: '#10B981', border: '#10B981' },
        { icon: '📦', label: 'Tổng đơn hàng', value: s.totalOrders,                     color: '#3B82F6', border: '#3B82F6' },
        { icon: '⏳', label: 'Chờ xử lý',    value: s.pendingOrders,                   color: '#F59E0B', border: '#F59E0B' },
        { icon: '🎁', label: 'Sản phẩm',      value: s.totalProducts,                   color: '#8B5CF6', border: '#8B5CF6' },
        { icon: '✅', label: 'Hoàn thành',     value: s.completedOrders,                 color: '#10B981', border: '#10B981' },
        { icon: '⭐', label: 'Đánh giá',       value: s.totalReviews,                    color: '#EC4899', border: '#EC4899' },
      ];

      document.getElementById('stats-grid').innerHTML = statsData.map(d => `
        <div class="stat-card" style="border-left-color:${d.border};">
          <div class="stat-card__icon" style="background:${d.color}18;">${d.icon}</div>
          <div>
            <div class="stat-card__value" style="color:${d.color};">${d.value}</div>
            <div class="stat-card__label">${d.label}</div>
          </div>
        </div>`).join('');
    }

    async function renderRecentOrders() {
      const orders = await Store.getOrders();
      const recent = orders.slice(0, 5);
      const STATUS_INFO = Store.ORDER_STATUSES;

      document.getElementById('recent-orders').innerHTML = recent.length === 0
        ? '<p style="color:var(--text-light);text-align:center;padding:20px;">Chưa có đơn hàng nào</p>'
        : recent.map(o => {
            const info = STATUS_INFO[o.status.toUpperCase()] || {};
            return `
              <div class="recent-item">
                <div>
                  <div class="recent-item__id">${o.id}</div>
                  <div class="recent-item__customer">${o.customer ? o.customer.name : 'Khách hàng'}</div>
                </div>
                <span class="badge badge-${o.status}">${info.icon || ''} ${info.label || o.status}</span>
                <div class="recent-item__total">${Store.formatPrice(o.total)}</div>
              </div>`;
          }).join('');
    }

    async function renderTopProducts() {
      const products = await Store.getProducts({ sort: 'popular' });
      const top = products.filter(p => p.sold > 0).slice(0, 5);
      const maxSold = top[0]?.sold || 1;

      document.getElementById('top-products').innerHTML = top.length === 0
        ? '<p style="color:var(--text-light);text-align:center;padding:20px;">Chưa có dữ liệu bán hàng</p>'
        : top.map((p, i) => `
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
            <div style="width:24px;height:24px;border-radius:50%;background:${['#F59E0B','#9CA3AF','#CD7F32','#C8A882','#C8A882'][i]||'#C8A882'};display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#fff;flex-shrink:0;">${i+1}</div>
            <img src="${formatImgUrl(p.images ? p.images[0] : '')}" style="width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid #EADBCE;" />
            <div style="flex:1;min-width:0;">
              <div style="font-size:0.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2B1D14;">${p.name}</div>
              <div class="progress-bar" style="margin-top:6px;">
                <div class="progress-bar__fill" style="width:${Math.round((p.sold / maxSold) * 100)}%;"></div>
              </div>
            </div>
            <div style="font-size:0.85rem;color:#8B5E3C;font-weight:700;white-space:nowrap;">${p.sold} đã bán</div>
          </div>`).join('');
    }

    async function renderCategoryStats() {
      const cats = await Store.getCategories();
      const products = await Store.getProducts();

      document.getElementById('category-stats').innerHTML = cats.map(cat => {
        const catProds = products.filter(p => p.categoryId === cat.id);
        const totalStock = catProds.reduce((s,p) => s + (p.stock || 0), 0);
        const totalSold  = catProds.reduce((s,p) => s + (p.sold || 0), 0);
        return `
          <div style="background:#FAF7F4;border-radius:12px;padding:16px;border:1px solid #EADBCE;">
            <div style="font-size:1.6rem;margin-bottom:6px;">${cat.icon}</div>
            <div style="font-size:0.92rem;font-weight:700;margin-bottom:10px;color:#2B1D14;">${cat.name}</div>
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;color:#7D6B5D;border-top:1px dashed #EADBCE;padding-top:8px;">
              <span><strong>${catProds.length}</strong> SP</span>
              <span>Còn: <strong>${totalStock}</strong></span>
              <span>Bán: <strong>${totalSold}</strong></span>
            </div>
          </div>`;
      }).join('');
    }

    async function resetData() {
      if (!confirm('Reset toàn bộ dữ liệu SQLite về mặc định ban đầu? Thao tác này sẽ đặt lại sản phẩm, đơn hàng mẫu.')) return;
      await Store.reset();
      showToast('Đã reset dữ liệu thành công!');
      setTimeout(() => location.reload(), 1000);
    }

    function handleAdminLogout() {
      Store.logoutAdmin();
      showToast('Đã đăng xuất khỏi tài khoản Admin');
      setTimeout(() => { window.location.href = '/admin/login.html'; }, 500);
    }

    async function initPage() {
      if (!Store.requireAdmin()) return;
      const admin = Store.getCurrentAdmin();
      if (admin) document.getElementById('admin-name').textContent = admin.name || admin.username;
      
      await Store.init();
      await renderStats();
      await renderRecentOrders();
      await renderTopProducts();
      await renderCategoryStats();
    }

    initPage();
  </script>
</body>
</html>
