<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập Admin – Handmade Corner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-section) 100%);
      padding: 20px;
    }
    .admin-login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
      border: 1.5px solid var(--border-light);
    }
    .admin-login-card__brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .admin-login-card__brand span {
      font-size: 3rem;
      display: block;
      margin-bottom: 8px;
    }
    .admin-login-card__brand h2 {
      font-family: var(--font-heading);
      color: var(--accent);
      font-size: 1.6rem;
      margin-bottom: 4px;
    }
    .admin-login-card__brand p {
      font-size: .85rem;
      color: var(--text-light);
    }
    .admin-login-card__badge {
      display: inline-block;
      padding: 2px 10px;
      background: var(--accent);
      color: #fff;
      font-size: .72rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="admin-login-card">
    <div class="admin-login-card__brand">
      <span>🧶</span>
      <h2>Handmade Corner</h2>
      <div class="admin-login-card__badge">Hệ thống Quản trị</div>
      <p style="margin-top:8px;">Vui lòng đăng nhập tài khoản Admin</p>
    </div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label class="form-label">Tên đăng nhập Admin <span class="required">*</span></label>
        <div style="position:relative;">
          <input type="text" id="admin-user" class="form-control" placeholder="Tên đăng nhập..." required
                 style="padding-left:38px;" value="admin" />
          <i class="fas fa-user" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:.9rem;"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu <span class="required">*</span></label>
        <div style="position:relative;">
          <input type="password" id="admin-pass" class="form-control" placeholder="Mật khẩu..." required
                 style="padding-left:38px;" value="admin123" />
          <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:.9rem;"></i>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;font-size:.82rem;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-medium);">
          <input type="checkbox" checked style="accent-color:var(--accent);" /> Ghi nhớ đăng nhập
        </label>
        <span style="color:var(--text-light);">Tài khoản mặc định: admin/admin123</span>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
        <i class="fas fa-sign-in-alt"></i> Đăng nhập Admin
      </button>

      <div style="text-align:center;margin-top:20px;">
        <a href="../index.html" style="font-size:.85rem;color:var(--text-medium);text-decoration:none;">
          <i class="fas fa-arrow-left"></i> Quay lại Cửa hàng
        </a>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <script src="../js/store.js"></script>
  <script>
    // Redirect if already logged in as admin
    if (Store.getCurrentAdmin()) {
      window.location.href = 'index.html';
    }

    function showToast(msg, type = 'success') {
      const tc = document.getElementById('toast-container');
      const t  = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'times-circle'}"></i> ${msg}`;
      tc.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    async function handleAdminLogin(event) {
      event.preventDefault();
      const user = document.getElementById('admin-user').value.trim();
      const pass = document.getElementById('admin-pass').value.trim();

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';

      const res = await Store.loginAdmin(user, pass);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Đăng nhập Admin';

      if (res.success) {
        showToast('Đăng nhập Admin thành công!');
        setTimeout(() => { window.location.href = 'index.html'; }, 600);
      } else {
        showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
